generations:
  - name: "First Generation"
    start_year: 2015
    end_year: 2020
    description: "The original Bentley Bentayga was the brand's first SUV, launched in December 2015, built on the Volkswagen Group MLB Evo platform shared with the Audi Q7 and Porsche Cayenne. It debuted with a 6.0L twin-turbo W12 engine producing 600 HP. The lineup expanded to include a 4.0L twin-turbo V8 petrol (2018), a 4.0L twin-turbo diesel V8 (2017), and a V6 PHEV (2019). The Bentayga featured Bentley's renowned craftsmanship with an ultra-luxurious interior and was available in four, five, or seven-seat configurations. Special editions included the Bentayga Speed with a 626 HP W12 engine. A total of 608 First Edition units were produced at launch."

  - name: "First Generation (Facelift)"
    start_year: 2020
    end_year: null
    description: "Released in June 2020, the facelifted Bentayga features a complete exterior redesign inspired by the Continental GT and Flying Spur. Key changes include 3D elliptical tail-lights with animated LEDs, new side vents, enlarged rear spoiler, repositioned number plate, and new wheel designs. The interior received a major update with a new 10.9-inch touchscreen infotainment system, digital instrument cluster replacing traditional dials, wireless smartphone charging, and enhanced rear seating with 100mm increase in knee space. Rear passengers receive a 5.0-inch touchscreen tablet for climate and entertainment control. Powertrain options include the 6.0L W12 (standard and Speed variant at 635 HP), 4.0L twin-turbo V8 (542 HP), and V6 PHEV. Additional variants introduced post-facelift include the Bentayga S (May 2021, sportier V8 version), Bentayga Azure (May 2022, comfort-oriented), and Bentayga EWB (May 2022, extended wheelbase intended to replace the Bentley Mulsanne)."
